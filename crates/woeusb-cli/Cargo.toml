[package]
name = "woeusb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for woeusb-rs"

[dependencies]
woeusb-core = { path = "../woeusb-core" }
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
indicatif = "0.17"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0"
dialoguer = "0.11"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.17"
